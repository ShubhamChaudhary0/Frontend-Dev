<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dropdown Selection</title>
  
</head>
<body>
  <h1>Choose Your Location</h1>

  <form>
    <label for="country">Country:</label>
    <select id="country" name="country">
      <option value="india" selected>India</option>
      <option value="usa">USA</option>
      <option value="uk">United Kingdom</option>
    </select>
    <br>

    <label for="state">State:</label>
    <select id="state" name="state">
      <option value="maharashtra">Maharashtra</option>
      <option value="karnataka" selected>Karnataka</option>
      <option value="delhi">Delhi</option>
    </select>
    <br>

    <label for="city">City:</label>
    <select id="city" name="city">
      <option value="bangalore" selected>Bangalore</option>
      <option value="mumbai">Mumbai</option>
      <option value="pune">Pune</option>
    </select>
    <br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
      <option value="bryantpark">Bryant Park</option>
      <option value="eiffel" selected>Eiffel Tower</option>
      <option value="bali">Bali Beaches</option>
    </select>
  </form>

  <p>Selected: Country - India; State - Karnataka; City - Bangalore; Place - Eiffel Tower</p>
</body>
</html>
