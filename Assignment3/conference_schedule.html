<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conference Schedule</title>
  
</head>
<body>
  <h1>Conference Schedule</h1>

  <table border="1">
    <caption>Daily Sessions</caption>
    <thead>
      <tr>
        <th>Session</th>
        <th>Time</th>
        <th>Topic</th>
        <th>Speaker</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Morning</td>
        <td>09:00 - 11:00</td>
        <td>Opening Keynote</td>
        <td>Dr. A</td>
      </tr>
      <tr>
        <td>Afternoon</td>
        <td>13:00 - 15:00</td>
        <td>Workshops</td>
        <td>Ms. B</td>
      </tr>
      <tr>
        <td>Evening</td>
        <td>17:00 - 19:00</td>
        <td>Panel Discussion</td>
        <td>Panelists</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="4">For more details, visit the conference desk.</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
