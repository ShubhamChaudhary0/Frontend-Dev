<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog</title>
  
</head>
<body>
  <h1>Product Catalog</h1>
  <table border="1" title="List of products">
    <caption>Available Products</caption>
    <thead>
      <tr>
        <th>Product</th>
        <th>Description</th>
        <th>Price</th>
        <th>Availability</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td rowspan="2">
          <!-- Image inside cell -->
          <img src="https://via.placeholder.com/100" alt="Product A image">
          <div>Product A</div>
        </td>
        <td>High quality gadget with useful features.</td>
        <td>₹1,999</td>
        <td>In Stock</td>
      </tr>
      <tr>
        <td colspan="2">Special bundle available with accessories.</td>
        <td>Limited Stock</td>
      </tr>

      <tr>
        <td>
          <img src="https://via.placeholder.com/100" alt="Product B image">
          <div>Product B</div>
        </td>
        <td>Comfortable and stylish item for daily use.</td>
        <td>₹799</td>
        <td>Out of Stock</td>
      </tr>

    </tbody>
  </table>
</body>
</html>
