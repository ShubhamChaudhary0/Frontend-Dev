<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let day = prompt("Enter day number (1-7):");
day = Number(day);
let result=""; 

switch (day) {
    case 1:
        result="Monday";
        break;
    case 2:
        result="Tuesday";
        break;
    case 3:
        result="Wednesday";
        break;
    case 4:
        result="Thursday";
        break;
    case 5:
        result="Friday";
        break;
    case 6:
        result="Saturday";
        break;
    case 7:
        result="Sunday";
        break;
    default:
        result="Invalid day number";
}

console.log(result);
document.write("The day is: " + result);



    </script>
</body>
</html>
