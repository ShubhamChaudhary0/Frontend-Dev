<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
  <h3>Pending Tasks <span class="badge bg-danger">3</span></h3>
  <ul class="list-group my-3">
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Finish Bootstrap Project <span class="badge bg-primary">High</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Review Portfolio <span class="badge bg-warning text-dark">Medium</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Send Feedback <span class="badge bg-success">Low</span>
    </li>
  </ul>
  <button class="btn btn-success">
    Completed <span class="badge bg-light text-dark">0</span>
  </button>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
