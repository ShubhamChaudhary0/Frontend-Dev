<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container text-center my-5">
  <h2 class="mb-4">Today's Menu</h2>
  <table class="table table-striped">
    <thead class="table-dark"><tr><th>Item</th><th>Category</th><th>Price</th></tr></thead>
    <tbody><tr><td>Pasta</td><td>Main Course</td><td>₹250</td></tr></tbody>
  </table>

  <h3 class="mt-5">Chef's Specials</h3>
  <ul class="list-group mx-auto" style="max-width:400px;">
    <li class="list-group-item">Truffle Risotto</li>
  </ul>

  <div class="mt-4">
    <img src="https://via.placeholder.com/400x200" class="img-fluid" alt="Food">
    <p class="lead mt-2">Delicious and Fresh</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
