<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card:hover { transform: scale(1.03); transition: 0.3s; box-shadow: 0 0 10px rgba(0,0,0,0.15); }
  </style>
</head>
<body>
<div class="container py-5 text-center">
  <h2 class="mb-4">Choose Your Plan</h2>
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card p-3">
        <h4>Basic</h4><h2>₹499</h2><p>Essential features</p>
        <button class="btn btn-outline-primary">Select</button>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3 bg-primary text-white">
        <h4>Pro</h4><h2>₹999</h2><p>Most Popular</p>
        <button class="btn btn-light">Select</button>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3">
        <h4>Premium</h4><h2>₹1499</h2><p>All Features</p>
        <button class="btn btn-outline-primary">Select</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
