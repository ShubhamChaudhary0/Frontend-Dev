<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
  <div class="card p-4">
    <h2 class="mb-3">User Notifications</h2>
    <div class="alert alert-success">✅ New message received!</div>
    <div class="alert alert-info">ℹ️ System maintenance at midnight.</div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      ⚠️ Warning: Account limit reached.
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="bg-light p-3 border mt-3">
      <strong>Summary:</strong> You have 3 active notifications.
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
