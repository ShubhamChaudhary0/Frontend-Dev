<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

<div class="container text-center p-5">
  <h1 class="fw-bold">Your Name</h1>
  <p class="lead mb-4">Web Developer & Designer</p>
  <img src="profile.jpg" alt="Profile" class="img-fluid rounded-circle mb-3" width="150">
  <div>
    <button class="btn btn-primary me-2">Hire Me</button>
    <button class="btn btn-outline-dark">Download CV</button>
  </div>

  <form class="mt-5">
    <input type="text" class="form-control mb-3" placeholder="Your Name">
    <input type="email" class="form-control mb-3" placeholder="Email">
    <textarea class="form-control mb-3" rows="3" placeholder="Message"></textarea>
    <button class="btn btn-success">Submit</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
