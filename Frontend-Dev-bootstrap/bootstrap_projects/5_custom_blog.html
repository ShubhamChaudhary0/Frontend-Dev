<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Blog Homepage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bs-primary: #6f42c1;
      --bs-font-sans-serif: 'Poppins', sans-serif;
    }
  </style>
</head>
<body>
<div class="container my-5">
  <h1 class="text-primary mb-4">My Tech Blog</h1>
  <div class="row">
    <div class="col-md-6">
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title text-primary">Post 1</h5>
          <p class="card-text">Intro to Bootstrap customization.</p>
        </div>
      </div>
    </div>
  </div>
</div>
<footer class="text-center text-muted py-3">© 2025 My Tech Blog</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
