<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q5 — Timetable Viewer</title>
</head>
<body>
  <h2>Timetable</h2>
  <select id="day">
    <option>Monday</option>
    <option>Tuesday</option>
    <option>Wednesday</option>
    <option>Thursday</option>
    <option>Friday</option>
  </select>
  <div id="out"></div>

  <script>
    document.getElementById('day').addEventListener('change', load);
    function load(){
      const day = document.getElementById('day').value;
      fetch('/timetable?day='+encodeURIComponent(day))
        .then(r=>r.json()).then(list=>{
          const out = document.getElementById('out');
          out.innerHTML = '';
          if(!list.length) { out.textContent = 'No classes today.'; return; }
          list.forEach(c=>{
            const div = document.createElement('div');
            div.innerHTML = `<strong>${c.subject}</strong> — ${c.faculty} <span>(${c.time})</span>`;
            out.appendChild(div);
          });
        }).catch(()=>{ document.getElementById('out').textContent = 'Failed to load timetable'; });
    }
    load();
  </script>
</body>
</html>
