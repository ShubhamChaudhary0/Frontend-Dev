<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q4 — Multi-API Dashboard</title>
  <style>
    .card{border:1px solid #ddd;padding:12px;border-radius:6px;width:200px;display:inline-block;margin:8px}
    .skeleton{background:#eee;height:20px;width:100px}
    .warn{color:orange}
  </style>
</head>
<body>
  <h2>Dashboard</h2>
  <div id="warn" class="warn"></div>
  <div id="cards">
    <div class="card" id="users">Users: <div class="skeleton"></div></div>
    <div class="card" id="orders">Orders: <div class="skeleton"></div></div>
    <div class="card" id="products">Products: <div class="skeleton"></div></div>
  </div>

  <script>
    const endpoints = ['/users','/orders','/products'];
    Promise.all(endpoints.map(e => fetch(e).then(r => { if(!r.ok) throw new Error('fail'); return r.json(); })))
      .then(([users, orders, products]) => {
        document.getElementById('users').innerHTML = `Users: ${users.length}`;
        document.getElementById('orders').innerHTML = `Orders: ${orders.length}`;
        document.getElementById('products').innerHTML = `Products: ${products.length}`;
      })
      .catch(err => {
        // partial: try to load each independently to show what we can
        document.getElementById('warn').textContent = 'Some data could not be loaded.';
        fetch('/users').then(r=>r.ok? r.json():[]).then(u=>document.getElementById('users').innerHTML=`Users: ${u.length}`);
        fetch('/orders').then(r=>r.ok? r.json():[]).then(o=>document.getElementById('orders').innerHTML=`Orders: ${o.length}`);
        fetch('/products').then(r=>r.ok? r.json():[]).then(p=>document.getElementById('products').innerHTML=`Products: ${p.length}`);
      });
  </script>
</body>
</html>
