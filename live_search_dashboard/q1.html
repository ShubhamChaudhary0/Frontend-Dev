<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q1 — Live Search</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    .result{display:flex;gap:10px;padding:8px;border-bottom:1px solid #eee}
    img{width:60px;height:60px;object-fit:cover}
    #loading{display:none}
  </style>
</head>
<body>
  <h2>Live Search (/products?q=...)</h2>
  <input id="search" placeholder="Search products..." autocomplete="off">
  <div id="loading">Loading...</div>
  <div id="results"></div>

  <script>
    $(function(){
      let xhr = null;
      $('#search').on('input', function(){
        const q = $(this).val().trim();
        if(xhr) xhr.abort();
        $('#results').empty();
        if(!q){ return; }
        $('#loading').show();
        xhr = $.ajax({
          url: '/products',
          data: { q },
          method: 'GET',
          success: function(data){
            $('#loading').hide();
            const filtered = data.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
            if(filtered.length === 0){ $('#results').text('No products found'); return; }
            filtered.forEach(p => {
              $('#results').append(`<div class="result"><img src="${p.image}" alt=""><div><strong>${p.name}</strong><div>₹${p.price}</div></div></div>`);
            });
          },
          error: function(){
            $('#loading').hide();
            $('#results').text('Error fetching products');
          }
        });
      });
    });
  </script>
</body>
</html>
