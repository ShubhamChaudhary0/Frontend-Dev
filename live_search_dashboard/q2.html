<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q2 — Employee Status Dashboard</title>
  <style>
    table{border-collapse:collapse;width:100%}
    td,th{padding:8px;border:1px solid #ddd}
    .error{color:red}
  </style>
</head>
<body>
  <h2>Employees</h2>
  <div id="error" class="error"></div>
  <table id="table"><thead><tr><th>ID</th><th>Name</th><th>Status</th><th>Toggle</th></tr></thead><tbody></tbody></table>

  <script>
    const base = '/employees';
    function fetchEmployees(){
      const xhr = new XMLHttpRequest();
      xhr.open('GET', base);
      xhr.onload = () => {
        if(xhr.status >= 200 && xhr.status < 300){
          const list = JSON.parse(xhr.responseText);
          render(list);
        } else document.getElementById('error').textContent = 'Failed to load employees';
      };
      xhr.onerror = () => document.getElementById('error').textContent = 'Network error';
      xhr.send();
    }
    function render(list){
      const tbody = document.querySelector('#table tbody');
      tbody.innerHTML = '';
      list.forEach(emp => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${emp.id}</td><td>${emp.name}</td><td class="status">${emp.status}</td><td></td>`;
        const td = tr.querySelector('td:last-child');
        const btn = document.createElement('button');
        btn.textContent = emp.status === 'active' ? 'Set Inactive' : 'Set Active';
        btn.addEventListener('click', () => toggle(emp, tr));
        td.appendChild(btn);
        tbody.appendChild(tr);
      });
    }
    function toggle(emp, tr){
      const prevStatus = emp.status;
      const newStatus = prevStatus === 'active' ? 'inactive' : 'active';
      // optimistic UI
      emp.status = newStatus;
      tr.querySelector('.status').textContent = newStatus;
      tr.querySelector('button').textContent = newStatus === 'active' ? 'Set Inactive' : 'Set Active';

      const xhr = new XMLHttpRequest();
      xhr.open('PATCH', `/employees/${emp.id}`);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = () => {
        if(!(xhr.status >=200 && xhr.status < 300)){
          // revert
          emp.status = prevStatus;
          tr.querySelector('.status').textContent = prevStatus;
          tr.querySelector('button').textContent = prevStatus === 'active' ? 'Set Inactive' : 'Set Active';
          document.getElementById('error').textContent = 'Failed to update status';
        }
      };
      xhr.onerror = () => {
        emp.status = prevStatus;
        tr.querySelector('.status').textContent = prevStatus;
        tr.querySelector('button').textContent = prevStatus === 'active' ? 'Set Inactive' : 'Set Active';
        document.getElementById('error').textContent = 'Network error while updating status';
      };
      xhr.send(JSON.stringify({ status: newStatus }));
    }
    fetchEmployees();
  </script>
</body>
</html>
